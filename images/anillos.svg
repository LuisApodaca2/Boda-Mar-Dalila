<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 500 340" fill="none">
  <defs>
    <!-- Gold metallic gradient for ring body -->
    <linearGradient id="goldLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#F5E6A3"/>
      <stop offset="18%"  stop-color="#D4AF7A"/>
      <stop offset="38%"  stop-color="#8B6D3A"/>
      <stop offset="55%"  stop-color="#C4A060"/>
      <stop offset="72%"  stop-color="#E8C97A"/>
      <stop offset="85%"  stop-color="#9A7840"/>
      <stop offset="100%" stop-color="#B8965A"/>
    </linearGradient>
    <linearGradient id="goldRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#F5E6A3"/>
      <stop offset="18%"  stop-color="#D4AF7A"/>
      <stop offset="38%"  stop-color="#8B6D3A"/>
      <stop offset="55%"  stop-color="#C4A060"/>
      <stop offset="72%"  stop-color="#E8C97A"/>
      <stop offset="85%"  stop-color="#9A7840"/>
      <stop offset="100%" stop-color="#B8965A"/>
    </linearGradient>

    <!-- Highlight shimmer on top of each ring -->
    <radialGradient id="shineLeft" cx="35%" cy="28%" r="50%">
      <stop offset="0%"  stop-color="#FFFDE0" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#F5E6A3" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#B8965A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shineRight" cx="65%" cy="28%" r="50%">
      <stop offset="0%"  stop-color="#FFFDE0" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#F5E6A3" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#B8965A" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="4" dy="8" stdDeviation="10" flood-color="#5C3A10" flood-opacity="0.45"/>
    </filter>
    <filter id="shadowR" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="-2" dy="8" stdDeviation="10" flood-color="#5C3A10" flood-opacity="0.35"/>
    </filter>

    <!-- Inner shadow / depth for ring hole -->
    <radialGradient id="innerLeft" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#F5F0E2" stop-opacity="0"/>
      <stop offset="100%" stop-color="#7A5520" stop-opacity="0.35"/>
    </radialGradient>
    <radialGradient id="innerRight" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#F5F0E2" stop-opacity="0"/>
      <stop offset="100%" stop-color="#7A5520" stop-opacity="0.3"/>
    </radialGradient>

    <!-- Clip for ring tube (annulus via clip) -->
    <clipPath id="clipLeft">
      <circle cx="178" cy="170" r="115"/>
    </clipPath>
    <clipPath id="clipRight">
      <circle cx="322" cy="170" r="115"/>
    </clipPath>
  </defs>

  <!-- ── LEFT RING ──────────────────────────── -->
  <g filter="url(#shadow)">
    <!-- Ring body (thick stroke = tube) -->
    <circle cx="178" cy="170" r="98"
      stroke="url(#goldLeft)" stroke-width="34" fill="none"/>
    <!-- Darker bottom shadow on tube -->
    <circle cx="178" cy="170" r="98"
      stroke="#7A5520" stroke-width="34" fill="none" opacity="0.18"/>
    <!-- Mid-tone edge definition -->
    <circle cx="178" cy="170" r="98"
      stroke="#E8C97A" stroke-width="2" fill="none" opacity="0.55"/>
    <circle cx="178" cy="170" r="81"
      stroke="#9A7840" stroke-width="1.5" fill="none" opacity="0.4"/>
    <!-- Shine overlay on tube top-left -->
    <circle cx="178" cy="170" r="98"
      stroke="url(#shineLeft)" stroke-width="34" fill="none" opacity="0.9"/>
    <!-- Bright specular highlight arc (top-left of ring) -->
    <path d="M 120,106 Q 145,72 190,86"
      stroke="#FFFCE8" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M 125,112 Q 148,82 186,94"
      stroke="white" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5"/>
    <!-- Inner hole depth shadow -->
    <circle cx="178" cy="170" r="80" fill="url(#innerLeft)" opacity="0.7"/>
  </g>

  <!-- ── RIGHT RING (slightly behind, overlapping) ── -->
  <g filter="url(#shadowR)">
    <circle cx="322" cy="170" r="98"
      stroke="url(#goldRight)" stroke-width="34" fill="none"/>
    <circle cx="322" cy="170" r="98"
      stroke="#7A5520" stroke-width="34" fill="none" opacity="0.18"/>
    <circle cx="322" cy="170" r="98"
      stroke="#E8C97A" stroke-width="2" fill="none" opacity="0.55"/>
    <circle cx="322" cy="170" r="81"
      stroke="#9A7840" stroke-width="1.5" fill="none" opacity="0.4"/>
    <circle cx="322" cy="170" r="98"
      stroke="url(#shineRight)" stroke-width="34" fill="none" opacity="0.9"/>
    <!-- Bright specular highlight arc -->
    <path d="M 264,106 Q 289,72 334,86"
      stroke="#FFFCE8" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M 269,112 Q 292,82 330,94"
      stroke="white" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5"/>
    <!-- Inner hole depth shadow -->
    <circle cx="322" cy="170" r="80" fill="url(#innerRight)" opacity="0.7"/>
  </g>

  <!-- ── Soft cast shadow on ground ── -->
  <ellipse cx="250" cy="295" rx="140" ry="18" fill="#8B6D3A" opacity="0.12"/>
</svg>
